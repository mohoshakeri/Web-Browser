worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream auth_upstream {
        server 127.0.0.1:__AUTH_PORT__;
    }

    upstream websockify_upstream {
        server 127.0.0.1:__WEBSOCKIFY_PORT__;
    }

    server {
        listen 0.0.0.0:80 default_server;
        server_name _;

        autoindex off;
        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location ~* /(\\.git|\\.env|\\.ht|\\.svn|\\.DS_Store) {
            deny all;
            return 404;
        }

        location ~ /\\. {
            deny all;
            return 404;
        }

        location = /auth/verify {
            internal;
            proxy_pass http://127.0.0.1:__AUTH_PORT__/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location @login_redirect {
            return 302 /login;
        }

        # Lightweight HTTP health check.
        location = /healthz {
            default_type text/plain;
            return 200 'ok\n';
        }

        location = /login {
            proxy_pass http://auth_upstream/login;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /logout {
            proxy_pass http://auth_upstream/logout;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://auth_upstream/auth/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /websockify {
            auth_request /auth/verify;
            error_page 401 = @login_redirect;

            proxy_pass http://websockify_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = / {
            auth_request /auth/verify;
            error_page 401 = @login_redirect;
            return 302 /vnc.html?autoconnect=1&resize=remote&path=websockify;
        }

        location / {
            auth_request /auth/verify;
            error_page 401 = @login_redirect;

            root /usr/share/novnc;
            try_files $uri =404;
            autoindex off;
        }
    }
}
